name: claims-module

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    environment:
      AZURITE_ACCOUNTS: "claimsdevstore:Y2xhaW1zLW1vZHVsZS1henVyaXRlLWRldi1rZXktMjAyNg=="
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=ClaimsModule;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=ClaimsModule;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Storage__Provider: AzureBlob
      Storage__Azure__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=claimsdevstore;AccountKey=Y2xhaW1zLW1vZHVsZS1henVyaXRlLWRldi1rZXktMjAyNg==;BlobEndpoint=http://azurite:10000/claimsdevstore;QueueEndpoint=http://azurite:10001/claimsdevstore;TableEndpoint=http://azurite:10002/claimsdevstore"
      Storage__Azure__Container: claim-documents
      Storage__Azure__PublicDownloadOrigin: http://localhost:10000
      Storage__MaxFileSizeBytes: "52428800"
      Auth__Jwt__Issuer: ClaimsModule.LocalDocker
      Auth__Jwt__Audience: ClaimsModule.Client.LocalDocker
      Auth__Jwt__SigningKey: ${CLAIMS_JWT_SIGNING_KEY}
      Auth__Jwt__ExpirationMinutes: "480"
      Auth__DevLoginEnabled: "true"
      Cors__Origins__0: http://localhost:4200
      Hangfire__DashboardEnabled: "false"
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      azurite:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/claims-ui/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver-data:
  azurite-data:
