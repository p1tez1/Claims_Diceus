name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
      - name: Restore
        run: dotnet restore backend/ClaimsModule.sln
      - name: Build
        run: dotnet build backend/ClaimsModule.sln --configuration Release --no-restore
      - name: Test (includes Testcontainers when Docker is available)
        run: dotnet test backend/ClaimsModule.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/claims-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/claims-ui/package-lock.json
      - run: npm ci
      - name: Unit tests (Chrome Headless)
        run: npm run test:ci -- --no-progress
      - name: Enforce typed HTTP boundary
        run: npm run test:http-boundary
      - name: Production build
        run: npm run build -- --configuration production

